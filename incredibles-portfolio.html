<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INCREDIBLES — Team Portfolio</title>
<meta name="description" content="INCREDIBLES — a four-member team portfolio (fictional demo content).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ PALETTE (constant everywhere) ============ */
:root{
  --navy:#0f1a35;
  --page:#eef3fb;
  --white:#ffffff;
  --soft:#5b6784;
  --line:#dfe6f3;
  --yellow:#ffc933;
  --teal:#19a7b8;
  --coral:#ff6b57;
  --pink:#ff7eb6;
  --mx:0; --my:0;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background:var(--page);color:var(--navy);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:10px}

/* ============ PAGE CARD ============ */
.card{
  position:relative;max-width:1240px;margin:20px auto;background:var(--white);
  border-radius:20px;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(15,26,53,.25),0 2px 6px rgba(15,26,53,.05);
  min-height:calc(100vh - 40px);
}
@media(max-width:640px){.card{margin:8px;border-radius:16px;min-height:calc(100vh - 16px)}}

/* ============ NAV ============ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo svg{width:24px;height:24px}
.nav ul{display:flex;align-items:center;gap:26px;list-style:none;font-size:13px;font-weight:600}
.nav ul a,.nav ul button{position:relative;padding:4px 0;font-weight:600;font-size:13px}
.nav ul a:not(.btn)::after,.nav ul button.lnk::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:var(--navy);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav ul a:not(.btn):hover::after,.nav ul button.lnk:hover::after{transform:scaleX(1)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;
  background:var(--navy);color:#fff;font-weight:700;font-size:14px;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s;
  box-shadow:0 8px 20px -8px rgba(15,26,53,.6);
}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 26px -10px rgba(15,26,53,.7)}
.btn:active{transform:translateY(0) scale(.97)}
.btn .arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(5px)}
.btn.sm{padding:9px 16px;font-size:12.5px}
.btn.ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--navy);box-shadow:0 10px 20px -12px rgba(15,26,53,.4)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
@media(max-width:760px){.nav ul li.hide-s{display:none}.nav{padding:14px 16px}.nav ul{gap:14px}}

/* ============ BACKGROUND BLOBS ============ */
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;z-index:0;
  transform:translate(calc(var(--mx)*var(--k,20)*1px),calc(var(--my)*var(--k,20)*1px));transition:transform .6s var(--ease)}
.blob i{display:block;width:100%;height:100%;border-radius:50%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.15)}}

/* ============ REVEAL (page-load orchestrated) ============ */
.rv{opacity:0;transform:translateY(26px);filter:blur(6px)}
#app.in .rv{opacity:1;transform:none;filter:none;
  transition:opacity .8s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s),filter .8s var(--ease) var(--d,0s)}

/* ============ HOME HERO ============ */
.hero{position:relative;text-align:center;padding:34px 20px 0;z-index:1}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--page);font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:18px}
.badge b{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(25,167,184,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(25,167,184,0)}100%{box-shadow:0 0 0 0 rgba(25,167,184,0)}}
.hero h1{font-size:clamp(40px,7vw,78px);line-height:1.02;letter-spacing:-.04em;font-weight:800}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.hero h1 .w span{display:inline-block;transform:translateY(110%);transition:transform 1s var(--ease)}
#app.in .hero h1 .w span{transform:none;transition-delay:calc(.15s + var(--i)*.09s)}
.hero p.sub{max-width:520px;margin:18px auto 24px;font-size:clamp(15px,1.6vw,18px);line-height:1.55;font-weight:500;color:#1d2a4a}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ============ TEAM ROW ============ */
.team{display:flex;justify-content:center;align-items:flex-end;margin-top:34px;padding:0 24px;position:relative;z-index:2}
.mem{position:relative;width:clamp(120px,21vw,260px);margin:0 -2.4vw;text-align:center;display:block;perspective:600px}
.mem:nth-child(1){--ac:var(--teal);--fd:0s;margin-bottom:6px}
.mem:nth-child(2){--ac:var(--coral);--fd:-1s;margin-bottom:34px}
.mem:nth-child(3){--ac:var(--yellow);--fd:-2s;margin-bottom:34px}
.mem:nth-child(4){--ac:var(--pink);--fd:-3s;margin-bottom:6px}
.mem .inner{transition:transform .5s var(--ease);transform-origin:50% 90%}
.mem .fl{animation:float 5s ease-in-out infinite;animation-delay:var(--fd)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
.mem .bub{position:absolute;left:8%;right:8%;top:8%;bottom:14%;border-radius:50%;background:var(--ac);opacity:.28;transition:opacity .4s,transform .6s var(--ease)}
.mem:hover,.mem:focus-visible{z-index:6}
.mem:hover .inner,.mem:focus-visible .inner{transform:scale(1.12) translateY(-14px) rotate(-2deg)}
.mem:hover .bub,.mem:focus-visible .bub{opacity:.6;transform:scale(1.15)}
.mem svg.av{position:relative;width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 16px 18px rgba(15,26,53,.2))}
.tag{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:var(--white);border:1.5px solid var(--line);padding:7px 14px;border-radius:999px;font-size:clamp(10px,1.15vw,13px);font-weight:800;letter-spacing:.01em;white-space:nowrap;
  box-shadow:0 8px 20px -10px rgba(15,26,53,.35);transition:background .35s,color .35s,transform .45s var(--ease),border-color .35s}
.mem:hover .tag,.mem:focus-visible .tag{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateX(-50%) translateY(-6px)}
.tag .go{max-width:0;overflow:hidden;opacity:0;transition:max-width .4s var(--ease),opacity .3s}
.mem:hover .tag .go,.mem:focus-visible .tag .go{max-width:60px;opacity:1}
@media(max-width:640px){
  .team{flex-wrap:wrap;margin-top:20px}
  .mem{width:44%;margin:0 2% 22px}
  .mem:nth-child(n){margin-bottom:22px}
}

.hint{position:relative;z-index:2;text-align:center;font-size:13.5px;font-weight:700;color:var(--soft);margin:0 0 30px}
/* ============ MARQUEE ============ */
.marq{background:var(--navy);color:#fff;overflow:hidden;white-space:nowrap;padding:16px 0;position:relative;z-index:2}
.marq div{display:inline-flex;gap:40px;animation:scroll 26s linear infinite;font-weight:800;font-size:clamp(18px,2.6vw,28px);letter-spacing:-.02em}
.marq span{display:inline-flex;align-items:center;gap:40px}
.marq span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.marq span:nth-child(3n+2)::after{background:var(--teal)}
.marq span:nth-child(3n)::after{background:var(--coral)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ============ ABOUT ============ */
.about{padding:70px 36px;position:relative;z-index:1}
.about h2{font-size:clamp(28px,4vw,46px);letter-spacing:-.035em;line-height:1.08;max-width:640px;font-weight:800}
.about .lead{max-width:560px;margin-top:14px;color:var(--soft);line-height:1.65;font-weight:500}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.val{padding:26px;border-radius:20px;background:var(--page);transition:transform .5s var(--ease),background .4s,color .4s}
.val:hover{transform:translateY(-8px);background:var(--navy);color:#fff}
.val:hover p{color:#c9d3ea}
.val .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;font-size:22px;transition:transform .5s var(--ease)}
.val:hover .ic{transform:rotate(-10deg) scale(1.1)}
.val h3{font-size:19px;letter-spacing:-.02em;margin-bottom:8px}
.val p{color:var(--soft);font-size:14.5px;line-height:1.6;font-weight:500;transition:color .4s}
footer{padding:26px 36px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--soft)}

/* ============ MEMBER PAGE ============ */
.mp{position:relative;padding:8px 32px 56px;z-index:1}
.back{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;background:var(--page);font-weight:700;font-size:14px;transition:background .35s,color .35s,transform .35s var(--ease)}
.back i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;transition:transform .4s var(--ease),background .3s}
.back:hover{background:var(--navy);color:#fff;transform:translateX(-4px)}
.back:hover i{background:var(--white);color:var(--navy);transform:translateX(-4px)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:44px;align-items:center;margin-top:26px}
@media(max-width:860px){.mgrid{grid-template-columns:1fr;gap:20px}.mp{padding:8px 18px 44px}}
.stage{position:relative;aspect-ratio:1/1.05;border-radius:32px;background:var(--ac);overflow:hidden;display:grid;place-items:end center;
  box-shadow:0 30px 60px -30px var(--ac)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 55%)}
.stage .sh{position:absolute;border-radius:50%;background:#fff;opacity:.28;transform:translate(calc(var(--mx)*var(--k)*1px),calc(var(--my)*var(--k)*1px));transition:transform .5s var(--ease)}
.stage .sh i{display:block;width:100%;height:100%;border-radius:50%;background:inherit;animation:drift 8s ease-in-out infinite alternate}
.stage .ring{position:absolute;left:50%;top:48%;width:78%;aspect-ratio:1;border:2px dashed rgba(15,26,53,.35);border-radius:50%;transform:translate(-50%,-50%);animation:spin 28s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.stage svg.av{position:relative;width:86%;height:auto;display:block;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 18px 20px rgba(15,26,53,.25))}
.stage .pill{position:absolute;padding:8px 14px;border-radius:999px;background:var(--white);font-weight:800;font-size:12.5px;box-shadow:0 10px 24px -10px rgba(15,26,53,.4);animation:float 6s ease-in-out infinite}
.stage .p1{left:6%;top:10%}
.stage .p2{right:6%;bottom:16%;animation-delay:-2s;max-width:70%}
.chip{display:inline-block;padding:7px 14px;border-radius:999px;background:var(--ac);font-weight:800;font-size:13px}
.mp h1{font-size:clamp(40px,7vw,84px);letter-spacing:-.045em;line-height:.98;margin:16px 0 14px;font-weight:800}
.mp .role{font-size:clamp(16px,1.8vw,20px);font-weight:700;line-height:1.4;max-width:540px}
.mp .assoc{margin-top:8px;color:var(--soft);font-weight:600;font-size:14px}
.mp .bio{margin-top:14px;color:var(--soft);line-height:1.7;font-weight:500;max-width:540px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;margin-top:26px;line-height:1.4}
.banner b{background:var(--yellow);color:var(--navy);padding:4px 10px;border-radius:99px;font-size:11.5px;white-space:nowrap}

.sec{margin-top:60px}
.sec h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;margin-bottom:6px;font-weight:800}
.sec .note{font-size:13px;font-weight:600;color:var(--soft);margin-bottom:20px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.skc{padding:10px 18px;border-radius:99px;background:var(--page);font-weight:700;font-size:14px;border:1.5px solid transparent;transition:transform .4s var(--ease),border-color .3s,background .3s}
.skc:hover{transform:translateY(-4px);border-color:var(--ac);background:var(--white)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.pc{border-radius:24px;border:1.5px solid var(--line);overflow:hidden;background:var(--white);transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s}
.pc:hover{transform:translateY(-8px);box-shadow:0 26px 40px -26px rgba(15,26,53,.45);border-color:var(--ac)}
.pc .ill{display:block;width:100%;height:auto;background:var(--ac)}
.pc .pb{padding:22px}
.pc h3{font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.pc .by{font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:10px}
.pc p{color:var(--soft);font-size:14.5px;line-height:1.6;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.tags span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--page)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}

.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.ac{padding:22px;border-radius:20px;background:var(--page);border-top:5px solid var(--ac);transition:transform .45s var(--ease),background .3s}
.ac:hover{transform:translateY(-6px);background:var(--white);box-shadow:0 20px 34px -24px rgba(15,26,53,.5)}
.demo{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--navy);color:#fff;margin-bottom:12px}
.ac h3{font-size:17px;letter-spacing:-.02em;line-height:1.3}
.ac p{margin-top:8px;font-size:13px;color:var(--soft);font-weight:500;line-height:1.5}

.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
.cinfo{display:grid;gap:12px}
.crow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--page);transition:transform .4s var(--ease)}
.crow:hover{transform:translateX(6px)}
.crow .ci{width:38px;height:38px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-size:17px;flex:none}
.crow small{display:block;font-size:11.5px;font-weight:700;color:var(--soft)}
.crow b{font-size:14.5px;word-break:break-all}
a.crow b{text-decoration:underline;text-underline-offset:3px}
.form{padding:24px;border-radius:22px;border:1.5px solid var(--line)}
.form h3{font-size:19px;letter-spacing:-.02em;margin-bottom:4px}
.form .fn{font-size:12.5px;color:var(--soft);font-weight:600;margin-bottom:16px;line-height:1.5}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:14.5px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);color:var(--navy);transition:border-color .25s,box-shadow .25s}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(25,167,184,.25)}
.fld [aria-invalid="true"]{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,107,87,.25)}
.err{display:none;margin-top:6px;font-size:12.5px;font-weight:700}
.err.show{display:flex;gap:6px;align-items:center;animation:pop .35s var(--ease)}
.err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--coral);color:var(--navy);font-size:11px;font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.ok{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--navy);color:#fff;font-size:13.5px;line-height:1.55;font-weight:600}
.ok.show{display:block;animation:pop .45s var(--ease)}
.ok b{color:var(--yellow)}

.nextbar{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.nx{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 10px;border-radius:999px;background:var(--page);font-weight:700;font-size:14px;transition:background .35s,color .35s,transform .4s var(--ease)}
.nx:hover{background:var(--navy);color:#fff;transform:translateY(-3px)}
.nx .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--navy);font-size:15px}

/* ============ PROJECT MODAL ============ */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(15,26,53,.62);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.modal.open{opacity:1;visibility:visible}
.dlg{position:relative;background:var(--white);border-radius:26px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:32px;transform:translateY(34px) scale(.96);transition:transform .55s var(--ease)}
.modal.open .dlg{transform:none}
.dlg .x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:var(--page);font-size:18px;font-weight:800;display:grid;place-items:center;transition:background .3s,color .3s,transform .4s var(--ease)}
.dlg .x:hover{background:var(--navy);color:#fff;transform:rotate(90deg)}
.dlg h3{font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:10px 40px 4px 0}
.dlg .by{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:16px}
.dlg h4{font-size:14px;margin:18px 0 6px;letter-spacing:-.01em}
.dlg p,.dlg li{font-size:14.5px;line-height:1.65;color:var(--soft);font-weight:500}
.dlg ul{padding-left:20px}
.dlg .mnote{margin-top:20px;padding:12px 14px;border-radius:12px;background:var(--page);font-size:12.5px;font-weight:600;color:var(--navy)}

/* ============ PAGE TRANSITION CURTAIN ============ */
.cover{position:fixed;inset:0;z-index:100;background:var(--navy);display:grid;place-items:center;clip-path:inset(100% 0 0 0);transition:clip-path .55s cubic-bezier(.77,0,.18,1);pointer-events:none}
.cover.on{clip-path:inset(0 0 0 0);pointer-events:all}
.cover.leave{clip-path:inset(0 0 100% 0);pointer-events:none}
.cover .cl{color:#fff;font-weight:800;font-size:clamp(26px,5vw,44px);letter-spacing:-.03em;display:flex;align-items:center;gap:12px;opacity:0;transform:scale(.9);transition:opacity .3s .2s,transform .5s var(--ease) .2s}
.cover.on .cl{opacity:1;transform:none}
.cover .dots{display:flex;gap:7px}
.cover .dots i{width:12px;height:12px;border-radius:50%;animation:bounce .8s ease-in-out infinite}
.cover .dots i:nth-child(1){background:var(--teal)}
.cover .dots i:nth-child(2){background:var(--coral);animation-delay:.1s}
.cover .dots i:nth-child(3){background:var(--yellow);animation-delay:.2s}
.cover .dots i:nth-child(4){background:var(--pink);animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-12px)}}

/* ============ REDUCED MOTION ============ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
  .rv{opacity:1;transform:none;filter:none}
  .hero h1 .w span{transform:none}
}
</style>
</head>
<body>

<div class="cover" id="cover" aria-hidden="true">
  <div class="cl"><span class="dots"><i></i><i></i><i></i><i></i></span>INCREDIBLES</div>
</div>

<div class="modal" id="modal" aria-hidden="true">

    <div class="ac"><span class="demo">DEMO CONTENT</span><h3>${a}</h3><p>Fictional sample achievement. No date, organization or certificate is claimed.</p></div>`).join("");
  const fid = k => `f-${m.id}-${k}`;

  return `
  <section class="mp" style="--ac:${COLORS[m.color]}">
    <a class="back rv" href="#/" style="--d:.05s" aria-label="Back to home"><i>←</i>Back to Home</a>

    <div class="mgrid">
      <div class="stage rv" style="--d:.15s">
        <div class="sh" style="--k:30;width:120px;height:120px;left:-20px;top:30%"><i></i></div>
        <div class="sh" style="--k:-24;width:90px;height:90px;right:8%;top:-20px"><i style="animation-delay:-3s"></i></div>
        <div class="ring"></div>
        ${avatarOrPhoto(m)}
        <span class="pill p1">${TEAM_NAME}</span>
        <span class="pill p2">Sample: ${m.company}</span>
      </div>
      <div>
        <span class="chip rv" style="--d:.25s">Team ${TEAM_NAME}</span>
        <h1 class="rv" style="--d:.33s">${m.name}</h1>
        <p class="role rv" style="--d:.42s">${m.role}</p>
        <p class="assoc rv" style="--d:.46s">Sample company association: ${m.company} (fictional)</p>
        <p class="bio rv" style="--d:.5s">${m.bio}</p>
        <div class="hero-cta rv" style="--d:.58s">
          <button class="btn" data-scroll="projects-sec">View projects <span class="arr">→</span></button>
          <button class="btn ghost" data-scroll="contact-sec">Contact ${first}</button>
        </div>
      </div>
    </div>

    <div class="banner rv" style="--d:.66s" role="note"><b>FICTIONAL DEMO</b><span>${DISCLAIMER}</span></div>

    <section class="sec rv" style="--d:.72s" id="skills-sec">
      <h2>Skills</h2>
      <p class="note">Sample profile data that can be edited later.</p>
      <div class="chips">${skills}</div>
    </section>

    <section class="sec rv" style="--d:.78s" id="projects-sec">
      <h2>Projects</h2>
      <p class="note">Sample projects. No real repositories, deployments, users or metrics are claimed.</p>
      <div class="pgrid">${projects}</div>
    </section>

    <section class="sec rv" style="--d:.84s" id="ach-sec">
      <h2>Achievements</h2>
      <p class="note">Fictional demo content only.</p>
      <div class="agrid">${ach}</div>
    </section>

    <section class="sec rv" style="--d:.9s" id="contact-sec">
      <h2>Contact ${first}</h2>
      <p class="note">Placeholder contact details. Emails use the reserved example.com domain.</p>
      <div class="cgrid">
        <div class="cinfo">
          <a class="crow" href="mailto:${m.email}"><span class="ci">✉️</span><span><small>Email (placeholder)</small><b>${m.email}</b></span></a>
          <div class="crow"><span class="ci">📞</span><span><small>Phone (placeholder)</small><b>${m.phone}</b></span></div>
          <a class="crow" href="https://github.com/" target="_blank" rel="noopener noreferrer"><span class="ci">💻</span><span><small>GitHub (placeholder link)</small><b>https://github.com/</b></span></a>
          <a class="crow" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"><span class="ci">🔗</span><span><small>LinkedIn (placeholder link)</small><b>https://www.linkedin.com/</b></span></a>
        </div>
        <form class="form" novalidate data-member="${m.id}" aria-labelledby="${fid("h")}">
          <h3 id="${fid("h")}">Send a message</h3>
          <p class="fn">This demo has no backend. The form checks your input but does not send anything.</p>
          <div class="fld"><label for="${fid("name")}">Name</label><input id="${fid("name")}" name="name" type="text" autocomplete="name" aria-describedby="${fid("name")}-e"><p class="err" id="${fid("name")}-e" role="alert"></p></div>
          <div class="fld"><label for="${fid("email")}">Email</label><input id="${fid("email")}" name="email" type="email" autocomplete="email" aria-describedby="${fid("email")}-e"><p class="err" id="${fid("email")}-e" role="alert"></p></div>
          <div class="fld"><label for="${fid("subject")}">Subject</label><input id="${fid("subject")}" name="subject" type="text" aria-describedby="${fid("subject")}-e"><p class="err" id="${fid("subject")}-e" role="alert"></p></div>
          <div class="fld"><label for="${fid("message")}">Message</label><textarea id="${fid("message")}" name="message" aria-describedby="${fid("message")}-e"></textarea><p class="err" id="${fid("message")}-e" role="alert"></p></div>
          <button class="btn" type="submit">Check message <span class="arr">→</span></button>

    <div class="nextbar rv" style="--d:.96s">
      <a class="nx" href="#/${prev.id}"><span class="dot" style="background:${COLORS[prev.color]}">←</span>${prev.name}</a>
      <a class="nx" href="#/${next.id}">${next.name}<span class="dot" style="background:${COLORS[next.color]}">→</span></a>
    </div>
  </section>`;
}

/* ============ PROJECT MODAL ============ */
const modal = document.getElementById("modal");
const mBody = document.getElementById("mBody");
const dlg = modal.querySelector(".dlg");
let lastFocus = null;

function openProject(mi, pi){
  const m = members[mi], p = m.projects[pi];
  const first = m.name.charAt(0)+m.name.slice(1).toLowerCase();
  mBody.innerHTML = `
    <span class="chip" style="--ac:${COLORS[m.color]}">Sample project</span>
    <h3 id="mTitle">${p.title}</h3>
    <div class="by">By ${first} · ${DISCLAIMER}</div>
    <p>${p.desc}</p>
    <h4>Problem statement</h4><p>${p.problem}</p>
    <h4>Proposed solution</h4><p>${p.solution}</p>
    <h4>Key features</h4><ul>${p.features.map(f=>`<li>${f}</li>`).join("")}</ul>
    <h4>Technology stack</h4><p>${p.stack}</p>
    <h4>Future improvements</h4><ul>${p.future.map(f=>`<li>${f}</li>`).join("")}</ul>
    <div class="pbtns" style="margin-top:20px">
      <button class="btn sm ghost" disabled>GitHub: not available</button>
      <button class="btn sm ghost" disabled>Live demo: not available</button>
    </div>
    <p class="mnote">This is sample content for a demonstration portfolio. It is not a deployed product, and no users or performance results are claimed.</p>`;
  lastFocus = document.activeElement;
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
  document.body.classList.add("lock");
  dlg.scrollTop = 0;
  setTimeout(()=>document.getElementById("mClose").focus(), 60);
}
function closeModal(){
  if(!modal.classList.contains("open")) return;
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
document.getElementById("mClose").addEventListener("click", closeModal);
modal.addEventListener("click", e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="Tab" && modal.classList.contains("open")){
    const f = dlg.querySelectorAll("button:not([disabled]),a[href]");
    if(!f.length) return;
    const a = f[0], z = f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
  }
});

/* ============ CONTACT FORM (validation only, no backend) ============ */
document.addEventListener("submit", e=>{
  const form = e.target.closest("form[data-member]");
  if(!form) return;
  e.preventDefault();
  const m = members.find(x=>x.id===form.dataset.member);
  const rules = {
    name:    v=>v.trim().length<2 ? "Enter your name (at least 2 characters)." : "",
    email:   v=>!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "Enter a valid email address, like name@example.com." : "",
    subject: v=>v.trim().length<3 ? "Enter a subject (at least 3 characters)." : "",
    message: v=>v.trim().length<10 ? "Write a message of at least 10 characters." : ""
  };
  let firstBad = null;
  Object.keys(rules).forEach(k=>{
    const input = form.elements[k], err = document.getElementById(input.id+"-e");
    const msg = rules[k](input.value);
    if(msg){ input.setAttribute("aria-invalid","true"); err.textContent = msg; err.classList.add("show"); if(!firstBad) firstBad = input; }
    else { input.removeAttribute("aria-invalid"); err.textContent = ""; err.classList.remove("show"); }
  });
  const ok = form.querySelector(".ok");
  if(firstBad){ ok.classList.remove("show"); firstBad.focus(); return; }
  const first = m.name.charAt(0)+m.name.slice(1).toLowerCase();
  ok.innerHTML = "";
  const b = document.createElement("b"); b.textContent = "Message checked, but NOT sent.";
  ok.append(b, document.createTextNode(` Your details are valid, but this demo site has no backend, so nothing was delivered to ${first} or anyone else. Your input stays only in this browser tab.`));
  ok.classList.add("show");
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.matches && t.matches("form[data-member] input, form[data-member] textarea") && t.getAttribute("aria-invalid")){
    t.removeAttribute("aria-invalid");
    const err = document.getElementById(t.id+"-e"); if(err){ err.textContent=""; err.classList.remove("show"); }
  }
});

/* ============ ROUTER + TRANSITIONS ============ */
const cover = document.getElementById("cover");
const wait = ms => new Promise(r=>setTimeout(r,ms));
let token = 0, first = true, pendingScroll = null;

function currentRoute(){
  const id = location.hash.replace(/^#\/?/,"");
  const idx = members.findIndex(m=>m.id===id);
  return idx>=0 ? {type:"member", idx} : {type:"home"};
}
function render(){
  closeModal();
  const r = currentRoute();
  app.classList.remove("in");
  app.innerHTML = r.type==="member" ? memberView(members[r.idx], r.idx) : homeView();
  document.title = r.type==="member" ? `${members[r.idx].name} — ${TEAM_NAME}` : `${TEAM_NAME} — Team Portfolio`;
  const cta = document.getElementById("navCta");
  cta.setAttribute("href", r.type==="member" ? "#/" : "#/sooraj");
  cta.firstChild.textContent = r.type==="member" ? "Home " : "Meet the team ";
  void app.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.classList.add("in")));
  window.scrollTo(0,0);
  if(pendingScroll){ const id=pendingScroll; pendingScroll=null; setTimeout(()=>scrollToId(id),400); }
}
let lastKey = null;
function routeKey(){ const r = currentRoute(); return r.type==="member" ? members[r.idx].id : "home"; }
function navigate(h){
  try{ if(location.hash!==h) location.hash = h; }catch(_){}
  setTimeout(go, 60);   // fallback if the browser does not fire hashchange
}
async function go(){
  const key = routeKey();
  if(key===lastKey) return;
  lastKey = key;
  const t = ++token;
  if(first){ first=false; render(); return; }
  cover.className = "cover on";
  await wait(620);
  if(t!==token) return;
  render();
  await wait(120);
  if(t!==token) return;
  cover.className = "cover leave";
  await wait(600);
  if(t!==token) return;
  cover.style.transition = "none";
  cover.className = "cover";
  void cover.offsetWidth;
  cover.style.transition = "";
}
window.addEventListener("hashchange", go);

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
document.addEventListener("click", e=>{
  const lk = e.target.closest('a[href^="#/"]');
  if(lk && !(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)){ e.preventDefault(); navigate(lk.getAttribute("href")); return; }
  const pj = e.target.closest("[data-proj]");
  if(pj){ const [a,b] = pj.dataset.proj.split(":").map(Number); openProject(a,b); return; }
  const b = e.target.closest("[data-scroll]");
  if(!b) return;
  const id = b.dataset.scroll;
  const home = currentRoute().type==="home";
  if(home && (id==="team"||id==="about")){ scrollToId(id); }
  else if(!home && !(id==="team"||id==="about")){ scrollToId(id); }
  else { pendingScroll = id; location.hash = "#/"; }
});

/* ============ MOUSE PARALLAX + EYE TRACKING ============ */
let raf = null, mxv = 0, myv = 0, ex = 0, ey = 0;
window.addEventListener("mousemove", e=>{
  mxv = (e.clientX/innerWidth - .5)*2;
  myv = (e.clientY/innerHeight - .5)*2;
  ex = e.clientX; ey = e.clientY;
  if(raf) return;
  raf = requestAnimationFrame(()=>{
    raf = null;
    document.documentElement.style.setProperty("--mx", mxv.toFixed(3));
    document.documentElement.style.setProperty("--my", myv.toFixed(3));
    document.querySelectorAll("svg.av").forEach(svg=>{
      const r = svg.getBoundingClientRect();
      const dx = ex-(r.left+r.width/2), dy = ey-(r.top+r.height*.4);
      const d = Math.hypot(dx,dy)||1, k = Math.min(1, d/220)*3.2;
      const tx = (dx/d*k).toFixed(2), ty = (dy/d*k).toFixed(2);
      svg.querySelectorAll(".pp").forEach(p=>p.style.transform=`translate(${tx}px,${ty}px)`);
    });
  });
},{passive:true});

go();
</script>
